name: Deploy to InfinityFree Hosting (rithamaya.rf.gd)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to InfinityFree FTP
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code from repository
      uses: actions/checkout@v4

    - name: 📂 Deploy files via FTP to InfinityFree htdocs
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftpupload.net
        username: if0_42545219
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: htdocs/
        protocol: ftp
        port: 21
        exclude: |
          **/.git*
          **/.git*/**
          database.sql
          README.md
